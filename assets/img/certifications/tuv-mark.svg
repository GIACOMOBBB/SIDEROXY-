<?xml version="1.0" encoding="UTF-8"?>
<!--
  SiderOXY — small text-based TÜV certification mark.
  Typographic certification label only (NOT a reproduction of the
  official TÜV SÜD trademark artwork). Renders the certification body
  wordmark as a small framed text seal sized 48-70px, used as a
  support element next to the "TÜV Italia" text label on each cert card.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="tuv-mark-title">
  <title id="tuv-mark-title">TÜV SÜD certification mark (text-based)</title>

  <!-- Outer frame -->
  <rect x="1" y="1" width="78" height="78" rx="3" ry="3"
        fill="#0d0d0f" stroke="#e6e6e6" stroke-width="1.2"/>

  <!-- Red accent corner bar -->
  <rect x="1" y="1" width="78" height="4" fill="#c0150c"/>

  <!-- Inner frame -->
  <rect x="7" y="11" width="66" height="62" rx="2" ry="2"
        fill="none" stroke="rgba(230,230,230,.35)" stroke-width="0.8"/>

  <!-- TÜV (top) -->
  <text x="40" y="42" text-anchor="middle"
        font-family="Arial Black, Helvetica, Arial, sans-serif"
        font-weight="900" font-size="20" fill="#f2f2f2"
        letter-spacing="0.5">TÜV</text>

  <!-- Divider line -->
  <line x1="18" y1="49" x2="62" y2="49" stroke="#f2f2f2" stroke-width="1.1"/>

  <!-- SÜD (bottom) -->
  <text x="40" y="65" text-anchor="middle"
        font-family="Arial Black, Helvetica, Arial, sans-serif"
        font-weight="900" font-size="14" fill="#f2f2f2"
        letter-spacing="2">SÜD</text>
</svg>
